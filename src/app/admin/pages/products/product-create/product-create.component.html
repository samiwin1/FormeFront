<div class="container-fluid">
  <div class="row">
    <div class="col-lg-12">
      <div class="card">
        <div class="card-header">
          <h5 class="card-title">{{ isEditMode ? 'Edit Product' : 'Add Product' }}</h5>
        </div>
        <div class="card-body">
          <form (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label for="formation" class="form-label">Formation</label>
              <select 
                class="form-select" 
                id="formation" 
                [(ngModel)]="selectedFormationId" 
                name="formation"
                required>
                <option [ngValue]="null">Select a formation</option>
                <option *ngFor="let formation of formations" [ngValue]="formation.id">
                  {{ formation.title }}
                </option>
              </select>
            </div>

            <div class="mb-3">
              <label for="price" class="form-label">Price</label>
              <input 
                type="number" 
                class="form-control" 
                id="price" 
                [(ngModel)]="price" 
                name="price"
                step="0.01"
                required>
            </div>

            <div class="mb-3">
              <label for="currency" class="form-label">Currency</label>
              <input 
                type="text" 
                class="form-control" 
                id="currency" 
                [(ngModel)]="currency" 
                name="currency"
                required>
            </div>

            <div class="mb-3 form-check">
              <input 
                type="checkbox" 
                class="form-check-input" 
                id="isAvailable" 
                [(ngModel)]="isAvailable" 
                name="isAvailable">
              <label class="form-check-label" for="isAvailable">
                Available
              </label>
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary">
                {{ isEditMode ? 'Update' : 'Create' }} Product
              </button>
              <button type="button" class="btn btn-secondary" routerLink="/admin/products/list">
                Cancel
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
